name: Release Build (Signed)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build - ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - name: macOS-x86_64
            os: macos-latest
            target: x86_64-apple-darwin

          - name: macOS-aarch64
            os: macos-latest
            target: aarch64-apple-darwin

          - name: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build release binaries
        run: |
          cargo build --package midi2stagetraxx-cli --release --target ${{ matrix.platform.target }}
          cargo build --package midi2stagetraxx-gui --release --target ${{ matrix.platform.target }}

      # macOS code signing (optional - requires certificates in secrets)
      - name: Sign macOS binaries
        if: matrix.platform.os == 'macos-latest' && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_IDENTITY: ${{ secrets.MACOS_IDENTITY }}
        run: |
          # Import certificate
          echo $MACOS_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p password build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p password build.keychain
          security import certificate.p12 -k build.keychain -P $MACOS_CERTIFICATE_PWD -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k password build.keychain

          # Sign binaries
          codesign --force --options runtime --sign "$MACOS_IDENTITY" target/${{ matrix.platform.target }}/release/midi2stagetraxx
          codesign --force --options runtime --sign "$MACOS_IDENTITY" target/${{ matrix.platform.target }}/release/midi2stagetraxx-gui

          # Clean up
          rm certificate.p12

      - name: Create macOS app bundle
        if: matrix.platform.os == 'macos-latest'
        run: |
          # Create GUI app bundle
          mkdir -p "MIDI to StageTraxx.app/Contents/MacOS"
          mkdir -p "MIDI to StageTraxx.app/Contents/Resources"

          cp target/${{ matrix.platform.target }}/release/midi2stagetraxx-gui "MIDI to StageTraxx.app/Contents/MacOS/midi2stagetraxx-gui"

          # Create Info.plist
          cat > "MIDI to StageTraxx.app/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>MIDI to StageTraxx</string>
              <key>CFBundleDisplayName</key>
              <string>MIDI to StageTraxx</string>
              <key>CFBundleIdentifier</key>
              <string>com.yourcompany.midi2stagetraxx</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>CFBundleExecutable</key>
              <string>midi2stagetraxx-gui</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>LSMinimumSystemVersion</key>
              <string>10.12.0</string>
          </dict>
          </plist>
          EOF

      - name: Package release
        shell: bash
        run: |
          mkdir -p dist

          if [[ "${{ matrix.platform.os }}" == "macos-latest" ]]; then
            # Package macOS app bundle
            cp -r "MIDI to StageTraxx.app" dist/
            cp target/${{ matrix.platform.target }}/release/midi2stagetraxx dist/

            # Create DMG (optional)
            # hdiutil create -volname "MIDI to StageTraxx" -srcfolder dist -ov -format UDZO midi2stagetraxx-${{ matrix.platform.name }}.dmg

            # For now, just create a tar.gz
            cd dist
            tar czf ../midi2stagetraxx-${{ matrix.platform.name }}.tar.gz *
          elif [[ "${{ matrix.platform.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.platform.target }}/release/midi2stagetraxx.exe dist/
            cp target/${{ matrix.platform.target }}/release/midi2stagetraxx-gui.exe dist/
            cd dist
            7z a ../midi2stagetraxx-${{ matrix.platform.name }}.zip *
          else
            cp target/${{ matrix.platform.target }}/release/midi2stagetraxx dist/
            cp target/${{ matrix.platform.target }}/release/midi2stagetraxx-gui dist/
            cd dist
            tar czf ../midi2stagetraxx-${{ matrix.platform.name }}.tar.gz *
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: midi2stagetraxx-${{ matrix.platform.name }}
          path: midi2stagetraxx-${{ matrix.platform.name }}.*

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
