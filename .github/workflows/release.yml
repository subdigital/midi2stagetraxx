name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build - ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cli_name: midi2stagetraxx
            gui_name: midi2stagetraxx-gui
            
          - name: macOS-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            cli_name: midi2stagetraxx
            gui_name: midi2stagetraxx-gui
            
          - name: macOS-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            cli_name: midi2stagetraxx
            gui_name: midi2stagetraxx-gui
            
          - name: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cli_name: midi2stagetraxx.exe
            gui_name: midi2stagetraxx-gui.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build CLI
        run: |
          cargo build --package midi2stagetraxx-cli --release --target ${{ matrix.platform.target }}

      - name: Build GUI
        run: |
          cargo build --package midi2stagetraxx-gui --release --target ${{ matrix.platform.target }}

      - name: Prepare binaries
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.platform.target }}/release/${{ matrix.platform.cli_name }} dist/
          cp target/${{ matrix.platform.target }}/release/${{ matrix.platform.gui_name }} dist/
          
          # Create README for the distribution
          cat > dist/README.txt << EOF
          MIDI to StageTraxx Converter
          ============================
          
          This package contains two programs:
          
          1. ${{ matrix.platform.cli_name }} - Command-line interface
          2. ${{ matrix.platform.gui_name }} - Graphical user interface
          
          CLI Usage:
          ----------
          ./${{ matrix.platform.cli_name }} -m yourfile.mid
          
          For more options:
          ./${{ matrix.platform.cli_name }} --help
          
          GUI Usage:
          ----------
          Double-click ${{ matrix.platform.gui_name }} or run from terminal:
          ./${{ matrix.platform.gui_name }}
          
          EOF

      - name: Create archive
        shell: bash
        run: |
          cd dist
          if [[ "${{ matrix.platform.os }}" == "windows-latest" ]]; then
            7z a ../midi2stagetraxx-${{ matrix.platform.name }}.zip *
          else
            tar czf ../midi2stagetraxx-${{ matrix.platform.name }}.tar.gz *
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: midi2stagetraxx-${{ matrix.platform.name }}
          path: |
            midi2stagetraxx-${{ matrix.platform.name }}.*

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          body: |
            # MIDI to StageTraxx Converter
            
            ## What's New
            - TODO: Add release notes here
            
            ## Downloads
            - **macOS**: Download the `.tar.gz` file for your architecture (x86_64 or aarch64)
            - **Linux**: Download the Linux `.tar.gz` file
            - **Windows**: Download the `.zip` file
            
            ## Installation
            
            ### macOS
            1. Download and extract the archive
            2. You may need to allow the apps in System Preferences > Security & Privacy
            3. Run from Terminal or double-click the GUI app
            
            ### Linux
            1. Download and extract the archive
            2. Make the binaries executable: `chmod +x midi2stagetraxx midi2stagetraxx-gui`
            3. Run from terminal
            
            ### Windows
            1. Download and extract the ZIP file
            2. Run the executables directly
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}